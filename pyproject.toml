[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hopscope"
version = "0.2.0"
description = "Adversarial measurement range for authority creep in multi-hop A2A delegation chains"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["a2a-sdk[http-server]>=1.3.1,<2", "httpx>=0.28,<1"]
authors = [{ name = "Evgeny Kiryak", email = "evgeny@maseclab.com" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "Topic :: Security",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
hopscope = "hopscope.cli:main"

[project.urls]
Homepage = "https://github.com/evkir/hopscope"
Research = "https://doi.org/10.5281/zenodo.23513214"

[tool.hatch.build.targets.wheel]
packages = ["src/hopscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live and not dvaa'"
markers = [
    "live: needs real network / Ollama; excluded by default",
    "dvaa: brings up labs/dvaa-chain with docker compose; excluded by default (pytest -m dvaa)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
